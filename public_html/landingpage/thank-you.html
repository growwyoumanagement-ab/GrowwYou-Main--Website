<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Groww You</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff6600;
            --primary-dark: #e65c00;
            --secondary-color: #ff9800;
            --text-main: #1a1a1b;
            --text-muted: #5f6368;
            --bg-light: #f8f9fa;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fdfdfd;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Abstract Background Shapes */
        .bg-shape {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            right: -100px;
        }
        .shape-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary-color);
            bottom: -50px;
            left: -50px;
        }

        .thank-you-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 20px rgba(255, 102, 0, 0.2);
            animation: scaleIn 0.6s 0.2s both cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .icon-wrapper i {
            color: white;
            font-size: 40px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 42px;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(255, 102, 0, 0.39);
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.23);
        }

        .btn i {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: translateX(-4px);
        }

        /* Mobile View Specifics */
        @media (max-width: 480px) {
            .thank-you-card {
                padding: 40px 20px;
                border-radius: 24px;
            }
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 16px;
            }
            .icon-wrapper {
                width: 80px;
                height: 80px;
            }
            .icon-wrapper i {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="thank-you-card">
        <div class="icon-wrapper">
            <i class="fas fa-check"></i>
        </div>
        <h1>Thank You!</h1>
        <p>Your query has been successfully submitted. <br> Our digital growth expert will contact you within 30 minutes to discuss your strategy.</p>
        <a href="index.html" class="btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</body>
</html>
